name: Post to TikTok inbox (draft)

# The ekonomi-shorts skill pushes an approved video to a temporary branch
#   queue/<video-name>   containing final.mp4 + caption.txt
# That push triggers this workflow. After the upload the branch is deleted.
on:
  push:
    branches:
      - "queue/**"

# one run at a time: the refresh token rotates and must not be used twice in parallel
concurrency:
  group: tiktok-token
  cancel-in-progress: false

permissions:
  contents: write   # to delete the temporary queue branch afterwards

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tool code (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tool

      - name: Checkout queued video
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: media

      - name: Show caption (paste it in the TikTok app)
        run: |
          ls -la media
          echo "----- caption -----"
          cat media/caption.txt || true

      - name: Upload to TikTok inbox
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/rt.txt
        run: python3 tool/poster/tiktok.py upload media/final.mp4

      - name: Store rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RT_FILE: ${{ runner.temp }}/rt.txt
        run: |
          if [ -s "$RT_FILE" ]; then
            echo "::add-mask::$(cat "$RT_FILE")"
            gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$RT_FILE"
            rm -f "$RT_FILE"
            echo "refresh token updated"
          else
            echo "no new refresh token (token step did not run)"
          fi

      - name: Delete the queue branch
        if: success()
        working-directory: media
        run: git push origin --delete "${GITHUB_REF_NAME}"
