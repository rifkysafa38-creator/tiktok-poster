name: Post to TikTok inbox (draft)

# Triggered by the ekonomi-shorts skill after you approve a video:
#   gh workflow run post.yml -f tag=<release-tag>
# The release <tag> holds final.mp4 (+ caption.txt in the release notes).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds final.mp4"
        required: true

# one run at a time: the refresh token rotates and must not be used twice in parallel
concurrency:
  group: tiktok-token
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download video from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --pattern 'final.mp4' --dir media
          ls -la media

      - name: Upload to TikTok inbox
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NEW_REFRESH_TOKEN_FILE: ${{ runner.temp }}/rt.txt
        run: python3 poster/tiktok.py upload media/final.mp4

      - name: Store rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RT_FILE: ${{ runner.temp }}/rt.txt
        run: |
          if [ -s "$RT_FILE" ]; then
            echo "::add-mask::$(cat "$RT_FILE")"
            gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$RT_FILE"
            rm -f "$RT_FILE"
            echo "refresh token updated"
          else
            echo "no new refresh token (token step did not run)"
          fi
